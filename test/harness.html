<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Testes — Diagnóstico Camelo</title>
</head>
<body>
<header class="topbar"><a class="brand" href="#/">t</a><span id="saveStatus"></span></header>
<main id="view"></main>
<div id="modal"></div>
<div id="toast"></div>
<pre id="results">RUNNING</pre>
<script src="../js/schema.js"></script>
<script src="../js/db.js"></script>
<script src="../js/config.js"></script>
<script src="../js/sync.js"></script>
<script src="../js/report.js"></script>
<script src="../js/app.js"></script>
<script>
(async function () {
  const out = [];
  const ok = (name, cond) => out.push((cond ? 'PASS' : 'FAIL') + ' :: ' + name);
  const ping = tag => { try { fetch('/report?data=' + encodeURIComponent('PROGRESS :: ' + tag)); } catch (e) { } };
  window.addEventListener('error', e => out.push('FAIL :: js-error :: ' + e.message));
  syncState.running = true; /* segura o auto-sync até a seção 9 */
  ping('inicio');
  try {
    /* limpa base anterior */
    for (const store of ['projects', 'nucleos', 'photos']) {
      const all = await dbAll(store);
      for (const row of all) await dbDel(store, row.id);
    }

    ping('s1');
    /* 1. criar projeto */
    const p = { id: newId(), nome: 'MRN — Teste', cliente: 'MRN', criadoEm: Date.now(), atualizadoEm: Date.now() };
    await dbPut('projects', p);
    ok('criar projeto', (await dbGet('projects', p.id)).nome === 'MRN — Teste');

    /* 2. criar núcleo e preencher campos */
    const n = { id: newId(), projectId: p.id, nome: 'Vila 1', dados: {}, criadoEm: Date.now(), atualizadoEm: Date.now() };
    n.dados.s2 = { moradores: '120', frequentadores: '90' };
    n.dados.s3 = { fontes: [{ id: newId(), tipo: 'Igarapé', contaminacao: ['Microbiológica'], distanciaEAS: '350', estiagem: 'Seca completamente' }] };
    await dbPut('nucleos', n);
    const n2 = await dbGet('nucleos', n.id);
    ok('criar núcleo com dados', n2.dados.s3.fontes[0].tipo === 'Igarapé');

    /* 3. progresso e seções */
    const prog = nucleoProgress(n2);
    ok('progresso 100% (obrigatórios preenchidos)', prog === 100, prog);
    ok('sectionHasData s2', sectionHasData(sectionById('s2'), n2.dados) === true);
    ok('sectionHasData s5 vazia', sectionHasData(sectionById('s5'), n2.dados) === false);

    /* 4. condicionais */
    ok('condicional equals', condSatisfied({ field: 'tipo', operator: 'equals', value: 'Outro' }, { tipo: 'Outro' }) === true);
    ok('condicional includes', condSatisfied({ field: 'c', operator: 'includes', value: 'X' }, { c: ['A', 'X'] }) === true);
    ok('condicional notEquals vazio', condSatisfied({ field: 't', operator: 'notEquals', value: 'Não' }, {}) === false);

    ping('s5');
    /* 5. foto: gera imagem via canvas e salva */
    const cv = document.createElement('canvas');
    cv.width = 2400; cv.height = 1600;
    const cx = cv.getContext('2d');
    cx.fillStyle = '#0EFBE3'; cx.fillRect(0, 0, 2400, 1600);
    cx.fillStyle = '#000'; cx.font = '120px sans-serif'; cx.fillText('FOTO TESTE', 200, 800);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9));
    const ph = await savePhoto(p.id, n.id, 's3', n.dados.s3.fontes[0].id, blob);
    ok('salvar foto', !!(await dbGet('photos', ph.id)));
    ok('foto comprimida <=1600px', Math.max(ph.w, ph.h) <= 1600);
    const fotos = await photosOf(n.id, p.id);
    ok('photosOf núcleo', fotos.length === 1);

    ping('s6');
    /* 6. backup: export → apaga tudo → import → confere */
    const backup = await exportProjectJSON(p.id);
    ok('export contém foto base64', backup.photos.length === 1 && backup.photos[0].dataUrl.startsWith('data:image/'));
    await dbDel('projects', p.id); await dbDel('nucleos', n.id); await dbDel('photos', ph.id);
    const res = await importProjectJSON(JSON.parse(JSON.stringify(backup)));
    ok('import núcleos', res.nucleos === 1);
    ok('import fotos', res.fotos === 1);
    const pBack = await dbGet('projects', p.id);
    const nBack = await dbGet('nucleos', n.id);
    const phBack = await dbGet('photos', ph.id);
    ok('roundtrip projeto', pBack && pBack.nome === 'MRN — Teste');
    ok('roundtrip núcleo', nBack && nBack.dados.s3.fontes[0].distanciaEAS === '350');
    ok('roundtrip foto blob', phBack && phBack.blob && phBack.blob.size > 0);

    ping('s7');
    /* 7. render: home, projeto, núcleo, relatório */
    location.hash = '#/';
    await route();
    ok('render home', document.querySelector('#view .hero') !== null);
    location.hash = '#/p/' + p.id;
    await route();
    ok('render projeto', document.querySelector('#view .nucleo-card') !== null);
    location.hash = '#/p/' + p.id + '/n/' + n.id;
    await route();
    ok('render núcleo: 8 seções', document.querySelectorAll('#view details.section').length === 8);
    ok('render núcleo: fonte com pills', document.querySelector('.array-item .pill.on') !== null);
    ok('render núcleo: foto thumb', document.querySelector('.thumb img') !== null);
    location.hash = '#/p/' + p.id + '/relatorio';
    await route();
    ok('render relatório', document.querySelector('#view .report-cover') !== null);
    ok('relatório tem figura', document.querySelector('.report-fig img') !== null);
    ok('relatório mostra distância', document.body.innerHTML.includes('350'));

    ping('s8');
    /* 8. interação: pill radio (usa a seção s5 do núcleo aberto)
       espera o route disparado pelo hashchange assentar antes de
       capturar o pill (senão clicamos num nó de um render antigo) */
    location.hash = '#/p/' + p.id + '/n/' + n.id;
    await route();
    await new Promise(r => setTimeout(r, 400));
    const pill = document.querySelector('#sec-s5 .pill');
    pill.click();
    await new Promise(r => setTimeout(r, 700));
    ok('pill radio grava valor', (state.nucleo.dados.s5 || {}).trataAgua === pill.dataset.value);
    ok('condicional re-render (tratamento aparece)', document.querySelector('#sec-s5 .section-body').innerHTML.includes('Como tratam?') === (pill.dataset.value !== 'Não'));

    ping('s9');
    /* 9. sincronização de verdade contra o backend */
    syncState.running = false;
    const r1 = await syncNow(false);
    ok('syncNow envia itens', r1.ok === true && r1.enviados >= 3, JSON.stringify(r1));
    const r2 = await syncNow(false);
    ok('re-sync sem pendências', r2.ok === true && r2.enviados === 0, JSON.stringify(r2));
    const cloud = await fetchPainel('agua-camelo-2026');
    const cp = cloud.projects.find(x => x.id === p.id);
    ok('painel contém o projeto', !!cp && cp.nome === 'MRN — Teste');
    const cf = cloud.photos.find(x => x.project_id === p.id);
    ok('painel contém a foto', !!cf);
    const imgRes = await fetch(publicPhotoUrl(cf.storage_path));
    ok('foto pública acessível', imgRes.ok && (await imgRes.blob()).size > 1000);

    ping('s10');
    /* 10. baixar da nuvem em um "aparelho limpo" (apaga local e baixa) */
    const nucleosDel = await dbByIndex('nucleos', 'byProject', p.id);
    for (const x of nucleosDel) await dbDel('nucleos', x.id);
    const photosDel = await dbByIndex('photos', 'byProject', p.id);
    for (const x of photosDel) await dbDel('photos', x.id);
    await dbDel('projects', p.id);
    const dl = await downloadCloudProject(cloud, p.id);
    const pRest = await dbGet('projects', p.id);
    const nRest = await dbByIndex('nucleos', 'byProject', p.id);
    const fRest = await dbByIndex('photos', 'byProject', p.id);
    ok('download restaura projeto', !!pRest && pRest.nome === 'MRN — Teste');
    ok('download restaura núcleo com dados', nRest.length === 1 && nRest[0].dados.s3.fontes[0].tipo === 'Igarapé');
    ok('download restaura foto com blob', fRest.length === 1 && fRest[0].blob && fRest[0].blob.size > 1000);
    /* 11. central abre direto (sem código) e lista o projeto da nuvem */
    location.hash = '#/central';
    await route();
    await new Promise(r => setTimeout(r, 1800));
    ok('central renderiza sem código', document.querySelector('[data-action="central-baixar"]') !== null);
    ok('central mostra o projeto', document.body.innerHTML.includes('MRN — Teste'));
    out.push('CLEANUP_ID :: ' + p.id);

  } catch (e) {
    out.push('FAIL :: exception :: ' + (e && e.stack || e));
  }
  const report = 'DONE\n' + out.join('\n');
  document.getElementById('results').textContent = report;
  try { await fetch('/report?data=' + encodeURIComponent(report)); } catch (e) { }
})();
</script>
</body>
</html>
